services:
  - type: web
    name: fieldwise-api
    runtime: python
    plan: starter
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT
    healthCheckPath: /api/health
    disk:
      name: fieldwise-sqlite
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: DATABASE_PATH
        value: /var/data/agritech.db
      - key: FRONTEND_ORIGIN
        fromService:
          type: web
          name: fieldwise-frontend
          envVarKey: RENDER_EXTERNAL_URL
      - key: FLASK_DEBUG
        value: "false"
      - key: AGMARKNET_RESOURCE_ID
        value: 9ef84268-d588-465a-a308-a864a43d0070
      - key: GROQ_MODEL
        value: openai/gpt-oss-20b
      - key: OPENWEATHER_API_KEY
        sync: false
      - key: DATA_GOV_IN_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false

  - type: web
    runtime: static
    name: fieldwise-frontend
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      - key: NODE_VERSION
        value: 20.19.0
      - key: VITE_API_BASE
        fromService:
          type: web
          name: fieldwise-api
          envVarKey: RENDER_EXTERNAL_URL
